<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COUNTER APP</title>
   <style>

    .counter{
        display:flex;
        flex-direction: column;
        margin: 100px auto;
        width:100px;
        /* align-items:center; */
        /* font-size:40px; */

    }
    .count{
        text-align: center;
        font-size:40px;
    }
    button{
        margin-top:10px;
        padding:8px;
        font-size:15px;
        cursor:pointer;
        border:none;
        color: white;
    }

    .increment{
        background-color: green;
    }
    .decrement{
        background-color: red;
    }
    .reset{
        background-color: grey;
    }
   </style>
</head>
<body>
   
    
    <div class="counter">
        <h1 class="count">0</h1>
        <span class="error"></span>
        <button class="increment" onclick="
            increment();
            ">Increase</button>
        <button class="decrement" onclick="decrement();">Decrease</button>
        <button class="reset" onclick="reset();
            ">Reset</button>
    </div>


    <script>

        const savedValue = localStorage.getItem("counter");

        let count = savedValue ? Number(savedValue) : 0;
        let result = document.querySelector('.count');
        result.innerHTML = count;

        let error = document.querySelector('.error');



        function update(){
            result.innerHTML = count;

            if(result.innerHTML > 0){
                result.style.color = "green";
            } else if(result.innerHTML < 0){
                result.style.color = "red";
            } else {
                result.style.color = "grey";
            }
            
            localStorage.setItem("counter", count);

        }



        function increment(){
           count++;

           update();
           console.log(result);

          
        }

        function decrement(){

            if(count <= 0){                
                error.innerHTML = "Count is less than 0";

                error.style.color = "red";
            } else {
                count--;

            }

            update();

        }

        function reset(){

            if(count === 0){
                error.innerHTML = "Count is already reset.";

                error.style.color = 'red';
            } else {
                count = 0;
            }

            update();

            // count = 0;
        }
        
    </script>
    
</body>
</html>
