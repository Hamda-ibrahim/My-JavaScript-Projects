<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                font-family: Arial;
            }

            .todo-grid,
            .todo-input-grid{
                display:grid;
                grid-template-columns:  200px 150px 100px;
                column-gap: 10px;
                row-gap: 10px;
                align-items: center;
            }

            .todo-input-grid{
                align-items: stretch;
            }

            .name-input,
            .due-date-input{
                font-size: 15px;
                padding:6px;
            }

            .addBtn{
                padding:6px;
                font-size: 15px;
                background-color: green;
                color: white;
                border:none;
                cursor: pointer
            }

            .delBtn{
                background-color: darkred;
                color:white;
                border:none;
                padding-top:10px;
                padding-bottom:10px;
                cursor:pointer;
                font-size:15px;
            }
        </style>
    </head>
    <body>

        <p>Todo List</p>
        <div class="todo-input-grid">
            <input type="text" placeholder="Task Name" class="js-input name-input">
            <input type="date" class="js-dueDate-input due-date-input">
            <button class="addBtn" onclick="addTodoList();
            ">Add</button>
            <p class="taskCounter"></p>
        </div>
        

        <div class="js-todoList-res todo-grid"></div>


        <script>
            let todoList = [{
                name: "make dinner",
                dueDate: "05-6-2026",
            }, {
                name: "wash Dishes",
                dueDate: "07-6-2026",
            }];

            
            renderTodoList();

            function renderTodoList(){
                let todoListHTML = "";
                
                for (let i = 0; i < todoList.length; i++){
                    let todoObject = todoList[i];


                    //Destructuring
                   // const name = todoObject.name;
                    //const dueDate = todoObject.dueDate;

                    const {name, dueDate} = todoObject; //this does the same as the two above lines

                    let html = `
                    <div> ${name} </div>
                    <div>${dueDate} </div>
                    <button onclick="
                    todoList.splice(${i},1);
                    renderTodoList();
                    " class="delBtn">Delete</button>`;

                    todoListHTML += html;
                }

               
                console.log(todoListHTML);
                document.querySelector('.js-todoList-res').innerHTML = todoListHTML;

                document.querySelector('.taskCounter').innerHTML = `Tasks: ${todoList.length}`

            }

            function addTodoList(){
                let inputElement = document.querySelector('.js-input');

                let todoListValue = inputElement.value;

                let dateInputElement = document.querySelector('.js-dueDate-input');

                let dueDate = dateInputElement.value;

                todoList.push({
                    name:        todoListValue,
                    dueDate: dueDate
            });

                inputElement.value = "";

                renderTodoList();

                console.log(todoList);
            }
        </script>
    </body>
</html>
